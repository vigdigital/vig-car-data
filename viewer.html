<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIG Car Data — Kho xe</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --text:#1d2327; --muted:#6b7280;
    --brand:#2271b1; --accent:#00782a; --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .meta{color:var(--muted);font-size:13px}
  header input{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:8px;min-width:220px;font-size:14px}
  .wrap{display:flex;gap:20px;max-width:1180px;margin:20px auto;padding:0 20px;align-items:flex-start}
  .side{flex:0 0 300px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}

  /* Sidebar 2 cấp: Hãng (node) › Dòng */
  .brand{border-bottom:1px solid var(--line)}
  .brand:last-child{border-bottom:0}
  .brand-h{padding:11px 16px;font-weight:700;background:#fafbfc;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
  .brand-h .tw{transition:transform .15s;color:var(--muted);font-size:11px}
  .brand.collapsed .tw{transform:rotate(-90deg)}
  .brand-h .cnt{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
  .brand.collapsed .models{display:none}
  .m{padding:10px 16px 10px 34px;border-top:1px solid #f2f4f6;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .m:hover{background:#f6f9fd}
  .m.active{background:#eaf3fc;box-shadow:inset 3px 0 0 var(--brand)}
  .m b{font-weight:600}
  .m .p{color:var(--accent);font-size:13px;white-space:nowrap}

  .main{flex:1;min-width:0}
  .detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 30px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumb span{color:#c3c4c7;margin:0 4px}
  .detail h2{margin:0 0 4px;font-size:24px}
  .detail .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .detail .sub a{color:var(--brand)}

  /* Tab phiên bản */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:18px 0 0}
  .tab{padding:9px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#f6f7f9;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);position:relative;top:2px}
  .tab:hover{background:#eef2f7}
  .tab.active{background:var(--card);color:var(--brand);border-color:var(--line);border-bottom:2px solid var(--card)}
  .tab small{display:block;font-weight:400;font-size:11px;color:var(--accent);margin-top:1px}
  .tab.disc{opacity:.55}
  .tab.disc .badge{display:inline-block;font-size:9px;font-weight:700;color:#b32d2e;background:#fbeaea;border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:middle}
  .discbar{background:#fbeaea;color:#8a2424;border:1px solid #f0c9c9;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
  .panel{padding:22px 2px 2px}
  .price{font-size:30px;font-weight:800;color:var(--accent);margin:0 0 4px}
  .panel .vlabel{color:var(--muted);font-size:13px;margin-bottom:20px}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 4px;border-bottom:1px solid #f0f2f4;font-size:14px;vertical-align:top}
  .specs td:first-child{color:var(--muted);width:210px}
  .specs td:last-child{font-weight:500}
  .empty{color:var(--muted);padding:60px;text-align:center}
  .chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--muted);margin-left:6px}
  @media(max-width:820px){.wrap{flex-direction:column}.side{flex:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>🚗 VIG Car Data</h1>
  <span class="meta" id="meta">đang tải…</span>
  <input id="q" type="search" placeholder="Tìm dòng xe…">
</header>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="detail" id="detail"><div class="empty">Chọn 1 dòng xe bên trái để xem chi tiết.</div></div></main>
</div>
<script>
const BASE = 'data/';
// const BASE = 'https://raw.githubusercontent.com/vigdigital/vig-car-data/master/data/';
const money = n => (n ? Number(n).toLocaleString('vi-VN') + ' đ' : '—');
const line = m => (m.name || '').replace(new RegExp('^\\s*' + (m.brand_name || '') + '\\s+', 'i'), '').trim() || m.name;
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brandCache = {};
let idx = null;

async function boot(){
  try{ idx = await (await fetch(BASE+'index.json',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('meta').textContent = 'Không đọc được index.json'; return; }
  const models = idx.brands.reduce((n,b)=>n+(b.models||[]).length,0);
  document.getElementById('meta').textContent = `${idx.brands.length} hãng · ${models} dòng xe · cập nhật ${(idx.updated_at||'').slice(0,10)}`;
  renderSide();
  document.getElementById('q').addEventListener('input', renderSide);
}

function renderSide(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const side=document.getElementById('side'); side.innerHTML='';
  idx.brands.forEach(b=>{
    const models=(b.models||[]).filter(m=>(m.name||'').toLowerCase().includes(q));
    if(!models.length) return;
    const box=document.createElement('div'); box.className='brand';
    const h=document.createElement('div'); h.className='brand-h';
    h.innerHTML=`<span class="tw">▼</span> ${esc(b.brand_name)} <span class="cnt">${models.length}</span>`;
    h.onclick=()=>box.classList.toggle('collapsed');
    box.appendChild(h);
    const ml=document.createElement('div'); ml.className='models';
    models.forEach(m=>{
      const meta={brand:b.brand,brand_name:b.brand_name,file:b.file,slug:m.slug,name:m.name,price:m.price};
      const d=document.createElement('div'); d.className='m';
      d.innerHTML=`<b>${esc(line(meta))}</b><span class="p">${money(m.price)}</span>`;
      d.onclick=()=>{document.querySelectorAll('.side .m').forEach(x=>x.classList.remove('active'));d.classList.add('active');openModel(meta);};
      ml.appendChild(d);
    });
    box.appendChild(ml); side.appendChild(box);
  });
  if(!side.children.length) side.innerHTML='<div class="empty" style="padding:30px">Không có dòng xe.</div>';
}

async function openModel(meta){
  if(!brandCache[meta.file]){ brandCache[meta.file]=await (await fetch(BASE+meta.file,{cache:'no-store'})).json(); }
  const model=(brandCache[meta.file].models||[]).find(x=>x.slug===meta.slug);
  const box=document.getElementById('detail');
  if(!model){ box.innerHTML='<div class="empty">Không thấy dữ liệu.</div>'; return; }
  const ln=line(meta);
  const versions=model.versions||[];
  const common=model.specs||[];
  const specTbl=(rows,title)=>rows.length?`<h3>${title} (${rows.length})</h3><table class="specs"><tbody>${
    rows.map(s=>`<tr><td>${esc(s.label)}</td><td>${esc(s.value)}</td></tr>`).join('')}</tbody></table>`:'';
  const onSale=versions.filter(v=>v.status!=='discontinued').length;

  // Tabs = phiên bản. Bản đang bán trước; bản ngừng bán làm mờ + nhãn.
  const tabs=versions.map((v,i)=>{
    const disc=v.status==='discontinued';
    return `<div class="tab${i===0?' active':''}${disc?' disc':''}" data-i="${i}">${esc(ln+' '+(v.name||''))}${disc?'<span class="badge">NGỪNG BÁN</span>':''}<small>${money(v.price)}</small></div>`;
  }).join('');
  box.innerHTML=`
    <div class="crumb">${esc(meta.brand_name)} <span>›</span> ${esc(ln)}</div>
    <h2>${esc(model.name)} ${model.year?`<span class="chip">${esc(model.year)}</span>`:''}</h2>
    <div class="sub">${onSale} phiên bản đang bán${versions.length>onSale?` · ${versions.length-onSale} ngừng bán`:''} · nguồn ${esc(model.source||'?')} · <a href="${esc(model.source_url||'#')}" target="_blank" rel="noopener">link nguồn</a></div>
    ${versions.length?`<div class="tabs">${tabs}</div>`:''}
    <div class="panel" id="panel"></div>`;

  const panel=box.querySelector('#panel');
  function showTab(i){
    const v=versions[i]||{name:'',price:model.price,specs:[]};
    const disc=v.status==='discontinued';
    panel.innerHTML=`<div class="price">${money(v.price)}</div>`
      + `<div class="vlabel">Phiên bản <strong>${esc(ln+' '+(v.name||''))}</strong></div>`
      + (disc?`<div class="discbar">⚠️ Bản này <strong>đã ngừng bán</strong>. ${esc(v.status_note||'')}</div>`:'')
      + specTbl(v.specs||[], 'Thông số phiên bản')
      + specTbl(common, 'Thông số chung của dòng '+ln);
  }
  box.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    box.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); showTab(+t.dataset.i);
  });
  showTab(0);
}
boot();
</script>
</body>
</html>
