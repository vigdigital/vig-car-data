<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIG Car Data — Kho xe</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --text:#1d2327; --muted:#6b7280;
    --brand:#2271b1; --accent:#00782a; --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .meta{color:var(--muted);font-size:13px}
  header input{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:8px;min-width:220px;font-size:14px}
  .wrap{display:flex;gap:20px;max-width:1180px;margin:20px auto;padding:0 20px;align-items:flex-start}
  .side{flex:0 0 300px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .side .bh{padding:10px 16px;font-weight:700;background:#fafbfc;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .side .m{padding:11px 16px;border-bottom:1px solid #f0f2f4;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .side .m:hover{background:#f6f9fd}
  .side .m.active{background:#eaf3fc;border-left:3px solid var(--brand);padding-left:13px}
  .side .m b{font-weight:600}
  .side .m .p{color:var(--accent);font-size:13px;white-space:nowrap}
  .main{flex:1;min-width:0}
  .detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 30px}
  .detail h2{margin:0 0 4px;font-size:24px}
  .detail .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .detail .sub a{color:var(--brand)}
  .price{font-size:30px;font-weight:800;color:var(--accent);margin:4px 0 22px}
  .price small{font-size:14px;color:var(--muted);font-weight:400}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:24px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 4px;border-bottom:1px solid #f0f2f4;font-size:14px;vertical-align:top}
  .versions td:first-child{font-weight:600}
  .versions td:last-child{text-align:right;color:var(--accent);font-weight:600;white-space:nowrap}
  .specs td:first-child{color:var(--muted);width:210px}
  .specs td:last-child{font-weight:500}
  .empty{color:var(--muted);padding:60px;text-align:center}
  .chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--muted);margin-left:6px}
  @media(max-width:820px){.wrap{flex-direction:column}.side{flex:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>🚗 VIG Car Data</h1>
  <span class="meta" id="meta">đang tải…</span>
  <input id="q" type="search" placeholder="Tìm model…">
</header>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="detail" id="detail"><div class="empty">Chọn 1 model bên trái để xem chi tiết.</div></div></main>
</div>
<script>
// Base kho: mặc định đọc data/ cùng thư mục (serve local). Đổi sang GitHub raw nếu muốn xem bản public.
const BASE = 'data/';
// const BASE = 'https://raw.githubusercontent.com/vigdigital/vig-car-data/master/data/';
const money = n => (n ? Number(n).toLocaleString('vi-VN') + ' đ' : '—');
const brandCache = {};
let all = []; // {brand, brand_name, file, slug, name, price}

async function boot(){
  let idx;
  try{ idx = await (await fetch(BASE+'index.json',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('meta').textContent = 'Không đọc được index.json'; return; }
  let models=0;
  idx.brands.forEach(b=>{ (b.models||[]).forEach(m=>{ all.push({brand:b.brand,brand_name:b.brand_name,file:b.file,slug:m.slug,name:m.name,price:m.price}); models++; }); });
  document.getElementById('meta').textContent = `${idx.brands.length} hãng · ${models} model · cập nhật ${(idx.updated_at||'').slice(0,10)}`;
  render();
  document.getElementById('q').addEventListener('input', render);
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const side=document.getElementById('side'); side.innerHTML='';
  const byBrand={};
  all.filter(m=>m.name.toLowerCase().includes(q)).forEach(m=>{(byBrand[m.brand_name]=byBrand[m.brand_name]||[]).push(m);});
  Object.keys(byBrand).sort().forEach(bn=>{
    const h=document.createElement('div'); h.className='bh'; h.textContent=bn; side.appendChild(h);
    byBrand[bn].forEach(m=>{
      const d=document.createElement('div'); d.className='m'; d.dataset.key=m.brand+'/'+m.slug;
      d.innerHTML=`<b>${m.name}</b><span class="p">${money(m.price)}</span>`;
      d.onclick=()=>open(m,d);
      side.appendChild(d);
    });
  });
  if(!all.length) side.innerHTML='<div class="empty" style="padding:30px">Kho trống.</div>';
}
async function open(m,el){
  document.querySelectorAll('.side .m').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  if(!brandCache[m.file]){ brandCache[m.file]=await (await fetch(BASE+m.file,{cache:'no-store'})).json(); }
  const model=(brandCache[m.file].models||[]).find(x=>x.slug===m.slug);
  const box=document.getElementById('detail');
  if(!model){ box.innerHTML='<div class="empty">Không thấy dữ liệu model.</div>'; return; }
  const vrows=(model.versions||[]).map(v=>`<tr><td>${v.name||''}</td><td>${money(v.price)}</td></tr>`).join('');
  const srows=(model.specs||[]).map(s=>`<tr><td>${s.label||''}</td><td>${s.value||''}</td></tr>`).join('');
  box.innerHTML=`
    <h2>${model.name} ${model.year?`<span class="chip">${model.year}</span>`:''}</h2>
    <div class="sub">Nguồn: ${model.source||'?'} · <a href="${model.source_url||'#'}" target="_blank" rel="noopener">link nguồn</a> · cập nhật ${(model.updated_at||'').slice(0,10)}</div>
    <div class="price">${money(model.price)} <small>(bản thấp nhất)</small></div>
    <h3>Phiên bản (${(model.versions||[]).length})</h3>
    <table class="versions"><tbody>${vrows||'<tr><td colspan=2 class=empty>—</td></tr>'}</tbody></table>
    <h3>Thông số kỹ thuật (${(model.specs||[]).length})</h3>
    <table class="specs"><tbody>${srows||'<tr><td colspan=2 class=empty>—</td></tr>'}</tbody></table>`;
}
boot();
</script>
</body>
</html>
